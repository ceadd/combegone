; Default comskip settings bundled with combegone.
; If you have ~/.comskip.ini, combegone uses that file instead.
; 111 = black frames + logo + scene change + resolution change + aspect ratio + silence.
; Silence and scene changes matter on cable channels that skip black frames between ads.
detect_method=111
; Don't penalise long logo-less stretches as "show": a single long ad (e.g. a 2.5 min charity spot)
; was being kept. Rely on the channel logo instead.
excessive_length_modifier=1
verbose=10
max_brightness=60
test_brightness=40
max_avg_brightness=19
non_uniformity=500
min_commercial_size=4
max_commercial_size=125
min_commercialbreak=25
max_commercialbreak=600
min_show_segment_length=125
validate_silence=1
validate_uniform=1
validate_scenechange=1
thread_count=4
max_repair_size=200
disable_heuristics=4
delete_logo_file=1
output_framearray=0
output_edl=1
